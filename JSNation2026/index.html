<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <title>[JSNation 2026] Walking down Netflix paved road - Misha Kazakov</title>
  <meta name="viewport" content="initial-scale=1,width=device-width"/>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <style>
    /* Speaker Notes Tooltip & Popover Styles */
    #speakerNotesWidget {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .notes-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 38px;
      padding: 0 14px 0 10px;
      background: rgba(26, 26, 26, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 9999px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
      cursor: pointer;
      outline: none;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .notes-btn:hover {
      background: rgba(42, 42, 42, 0.95);
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.8), 0 0 10px rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    #speakerNotesWidget.pinned .notes-btn {
      background: rgba(255, 85, 68, 0.2);
      border-color: #ff5544;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(255, 85, 68, 0.4);
    }

    .notes-btn-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      color: #ff5544;
      transition: transform 0.2s ease;
    }

    .notes-btn:hover .notes-btn-icon {
      transform: scale(1.08);
    }

    .notes-btn-label {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
    }

    /* Popover */
    .notes-popover {
      position: absolute;
      bottom: calc(100% + 10px);
      right: 0;
      width: min(440px, calc(100vw - 36px));
      max-height: min(540px, calc(100vh - 100px));
      background: rgba(18, 18, 18, 0.95);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 1px rgba(255, 255, 255, 0.25);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px) scale(0.97);
      transform-origin: bottom right;
      transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1), transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Invisible hover-bridge between button and popover to prevent hover flicker */
    .notes-popover::after {
      content: "";
      position: absolute;
      bottom: -14px;
      left: 0;
      right: 0;
      height: 14px;
    }

    #speakerNotesWidget:hover .notes-popover,
    #speakerNotesWidget.pinned .notes-popover {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.03);
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      flex-shrink: 0;
    }

    .notes-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .notes-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #ff5544;
    }

    .notes-slide-pill {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.65);
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .notes-pin-indicator {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      margin-left: auto;
      margin-right: 6px;
      display: none;
    }

    #speakerNotesWidget.pinned .notes-pin-indicator {
      display: inline-block;
    }

    .notes-close-btn {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.45);
      font-size: 18px;
      line-height: 1;
      border-radius: 4px;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
      outline: none;
    }

    .notes-close-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .notes-body {
      padding: 16px 18px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.65;
      color: #E2E2E2;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
      -webkit-user-select: text;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
    }

    .notes-body::-webkit-scrollbar {
      width: 6px;
    }

    .notes-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.22);
      border-radius: 3px;
    }

    .notes-body::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .notes-body a {
      color: #ff6a59;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .notes-body a:hover {
      color: #ff8577;
    }

    .empty-notes {
      font-style: italic;
      color: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body id="body" bgcolor="black">
  <div id="stageArea">
    <div id="stage" class="stage"></div>
    <div id="hyperlinkPlane" class="stage"></div>
  </div>
  <div id="slideshowNavigator"></div>
  <div id="slideNumberControl"></div>
  <div id="slideNumberDisplay"></div>
  <div id="helpPlacard"></div>
  <div id="waitingIndicator"><div id="waitingSpinner"></div></div>

  <!-- Speaker Notes Tooltip Widget -->
  <div id="speakerNotesWidget" class="notes-widget">
    <button id="notesToggleBtn" class="notes-btn" aria-label="Toggle speaker notes" title="Speaker Notes (hover to view, click to pin)">
      <span class="notes-btn-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      </span>
      <span class="notes-btn-label">Notes</span>
    </button>
    <div id="notesPopover" class="notes-popover">
      <div class="notes-header">
        <div class="notes-title">
          <span class="notes-badge">Speaker Notes</span>
          <span class="notes-slide-pill">Slide <span id="notesSlideNumber">1</span> of <span id="notesTotalSlides">37</span></span>
        </div>
        <span class="notes-pin-indicator">Pinned</span>
        <button id="notesCloseBtn" class="notes-close-btn" aria-label="Close notes" title="Unpin notes">×</button>
      </div>
      <div id="notesBody" class="notes-body">Loading notes…</div>
    </div>
  </div>

  <!-- Keynote web player -->
  <script src="assets/player/main.js"></script>

  <!-- Presenter Notes data & integration -->
  <script src="assets/notes.js"></script>
  <script>
    (function () {
      var widget = document.getElementById('speakerNotesWidget');
      var toggleBtn = document.getElementById('notesToggleBtn');
      var closeBtn = document.getElementById('notesCloseBtn');
      var slideNumEl = document.getElementById('notesSlideNumber');
      var totalSlidesEl = document.getElementById('notesTotalSlides');
      var notesBodyEl = document.getElementById('notesBody');

      var currentSlideIndex = 0;
      var notesList = window.SLIDE_NOTES || [];

      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function formatNote(rawText) {
        if (!rawText || !rawText.trim()) {
          return '<span class="empty-notes">No speaker notes for this slide.</span>';
        }
        var cleaned = rawText
          .replace(/\[[Cc]lick\]/g, '')
          .replace(/[ \t]+/g, ' ')
          .replace(/ ([.,;:?!])/g, '$1')
          .trim();
        if (!cleaned) {
          return '<span class="empty-notes">No speaker notes for this slide.</span>';
        }
        var text = escapeHtml(cleaned);
        // Linkify URLs
        text = text.replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
        return text;
      }

      function renderNote(index) {
        currentSlideIndex = index;
        if (slideNumEl) {
          slideNumEl.textContent = String(index + 1);
        }
        if (notesBodyEl) {
          var noteText = (notesList && notesList[index]) ? notesList[index] : '';
          notesBodyEl.innerHTML = formatNote(noteText);
          notesBodyEl.scrollTop = 0;
        }
      }

      function initNotes() {
        if (notesList && notesList.length > 0) {
          if (totalSlidesEl) {
            totalSlidesEl.textContent = String(notesList.length);
          }
          renderNote(0);
        } else {
          // Fallback fetch if opened via http server and window.SLIDE_NOTES missed
          fetch('assets/notes.json')
            .then(function (res) { return res.json(); })
            .then(function (data) {
              notesList = data;
              if (totalSlidesEl) {
                totalSlidesEl.textContent = String(notesList.length);
              }
              renderNote(currentSlideIndex);
            })
            .catch(function () {
              if (notesBodyEl) {
                notesBodyEl.innerHTML = '<span class="empty-notes">Unable to load notes.</span>';
              }
            });
        }
      }

      // Listen for Keynote player slide changes
      document.addEventListener('ShowController:SlideIndexDidChangeEvent', function (e) {
        if (e && e.detail && typeof e.detail.slideIndex === 'number') {
          renderNote(e.detail.slideIndex);
        }
      });

      // Prevent mouse and touch events inside the notes widget from bubbling to Keynote's slide click-to-advance handler
      widget.addEventListener('click', function (e) {
        e.stopPropagation();
      });
      widget.addEventListener('mousedown', function (e) {
        e.stopPropagation();
      });
      widget.addEventListener('touchstart', function (e) {
        e.stopPropagation();
      });

      // Toggle pin on button click
      toggleBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        widget.classList.toggle('pinned');
      });

      // Close / unpin
      closeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        widget.classList.remove('pinned');
      });

      // Click outside unpins
      document.addEventListener('click', function () {
        widget.classList.remove('pinned');
      });

      initNotes();
    })();
  </script>
</body>
</html>
